name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: qyou
          POSTGRES_PASSWORD: qyou_ci_password
          POSTGRES_DB: qyou_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qyou -d qyou_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Used by `prisma generate`/validate and as the API's database in e2e tests.
      DATABASE_URL: postgresql://qyou:qyou_ci_password@localhost:5432/qyou_test?schema=public
      TEST_DATABASE_URL: postgresql://qyou:qyou_ci_password@localhost:5432/qyou_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Apply migrations to the test database
        run: pnpm db:deploy:test
      - run: pnpm test:e2e
      - run: pnpm build
